<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Buttons</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-4">
        <div>
            <button type="button" id="button-1" class="btn btn-primary">Button-1</button>
            <button type="button" id="button-2" class="btn btn-outline-secondary">Button-2</button>
            <button type="button" id="button-3" class="btn btn-success btn-lg">Button-3</button>
            <button type="button" id="button-4" class="btn btn-danger btn-sm">Button-4</button>
        </div>
        <br>
        <div>
            <button type="button" id="button-5" class="btn btn-warning btn-lg vw-100">Button-5</button>
        </div>
        <br>
        <div>
            <button type="button" id="button-6" class="btn btn-info" disabled>Button-6</button>
            <button type="button" id="button-7" class="btn btn-light">Button-7</button>
            <button type="button" id="button-8" class="btn btn-link">Button-8</button>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
